name: Paczka serwerowa
# Po każdej aktualizacji paczki buduje ZIP dla serwera (mody tylko serwerowe + configi + datapacki)
# i podmienia go w wydaniu "serwer": https://github.com/morsuu/ManianowniaPack/releases/tag/serwer
on:
  push:
    branches: [main]
    paths: ["pack.toml", "index.toml", "mods/**", "config/**", "moonlight-global-datapacks/**", "instalacja/serwer/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: serwer
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pobierz mody i configi (strona serwera)
        run: |
          mkdir serwer
          cp instalacja/serwer/packwiz-installer-bootstrap.jar serwer/
          cd serwer
          java -jar packwiz-installer-bootstrap.jar -g -s server "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/pack.toml"
          rm -rf packwiz-installer-bootstrap.jar packwiz-installer.jar packwiz.json resourcepacks options.txt
          cp ../instalacja/serwer/server-icon.png .
          cp ../instalacja/serwer/server.properties server.properties.wzor
          ls mods | wc -l
          zip -qr ../ManianowniaPack-serwer.zip .
      - name: Podmień ZIP w wydaniu "serwer"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 '^version' pack.toml | cut -d'"' -f2)
          gh release view serwer >/dev/null 2>&1 || gh release create serwer --title "Paczka serwerowa" --notes "ZIP z modami i configami dla serwera. Aktualizuje się automatycznie przy każdej wersji paczki."
          gh release upload serwer ManianowniaPack-serwer.zip --clobber
          gh release edit serwer --notes "Wersja paczki: ${VER}. Rozpakuj w folderze serwera (najpierw usuń stare foldery mods i config). Szczegóły w README."
      - name: Test - uruchomienie serwera z paczką
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir test && cd test
          unzip -q ../ManianowniaPack-serwer.zip
          curl -sSL -o fabric-server-launch.jar https://meta.fabricmc.net/v2/versions/loader/1.20.1/0.19.5/1.0.1/server/jar
          echo "eula=true" > eula.txt
          printf "online-mode=false\nmax-tick-time=-1\nspawn-protection=0\n" > server.properties
          ( sleep 420; echo "function manianownia:boss_tick"; echo "function manianownia:legenda/tick"; sleep 10; echo "stop" ) | timeout 900 java -Xmx8G -jar fabric-server-launch.jar nogui > server-test.log 2>&1 || true
          grep -E "Done \(|puffish_skills\]|Loaded [0-9]+ chapter|Failed to load function|Couldn't|ERROR|Exception" server-test.log | head -200 > server-test-summary.log || true
          cat server-test-summary.log
          cp server-test.log ../server-test.log
          cd ..
          gh release upload serwer server-test.log test/server-test-summary.log --clobber
